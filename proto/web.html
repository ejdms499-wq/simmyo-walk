<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>심묘한 산책 · 웹 시안</title>
<link rel="stylesheet" href="../fonts/fonts-m.css?v=2">
<style>
:root{--paper:#ece2c6;--paper2:#e3d6b4;--ink:#1f1a15;--ink2:#5b4e42;--coral:#c9532b;--amber:#e3a33b;--teal:#2f5d57}
*{box-sizing:border-box}
html,body{margin:0;background:#cdbf9c;color:var(--ink);font-family:'Noto Serif KR',serif}
body{cursor:none;overflow-x:hidden}
.stage{position:relative;width:min(1440px,96vw);margin:28px auto 60px}
/* 두 겹: 사람 지면(흑백 · 글자) 위에 고양이 지면(컬러 · 흰 종이)이 렌즈 모양으로 */
.sheet{position:relative;background:var(--paper);padding:34px 44px 40px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.08)}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background:radial-gradient(rgba(80,60,30,.18) 1px,transparent 1.2px) 0 0/5px 5px;mix-blend-mode:multiply}
.cat{position:absolute;inset:0;clip-path:circle(0 at 50% 50%);pointer-events:none;transition:clip-path .05s linear}
.cat .sheet{background:#f3e9d0}
.cat .sheet::before{display:none}

/* 제호 */
.mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;border-bottom:6px double var(--ink);padding-bottom:10px}
.mast .l,.mast .r{font:500 12px/1.6 'Noto Sans KR',sans-serif;color:var(--ink2)}
.mast .r{text-align:right}
.mast h1{margin:0;font:900 84px/1 'Noto Serif KR',serif;letter-spacing:.06em;text-align:center}
.mast h1 small{display:block;font:700 15px/1.2 'Noto Sans KR',sans-serif;letter-spacing:.6em;margin-top:8px;color:var(--ink2)}
.rule{display:flex;justify-content:space-between;font:700 12px 'Noto Sans KR',sans-serif;border-bottom:1.5px solid var(--ink);padding:7px 2px;letter-spacing:.08em}

/* 지면 격자 */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0 22px;margin-top:18px}
.art{position:relative;border-top:1.5px solid var(--ink);padding-top:12px;margin-bottom:24px}
.art h2{margin:0 0 6px;font:900 26px/1.22 'Noto Serif KR',serif;letter-spacing:-.01em}
.art h2.s{font-size:19px}
.art .kick{font:700 11.5px 'Noto Sans KR',sans-serif;letter-spacing:.12em;color:var(--coral);margin-bottom:6px}
.art p{margin:0 0 8px;font-size:13.5px;line-height:1.78;text-align:justify;word-break:keep-all}
.ph{position:relative;margin:4px 0 8px;border:1px solid var(--ink);overflow:hidden;background:#000}
.ph img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15) brightness(1.05)}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.35) 30%,transparent 34%) 0 0/3.2px 3.2px;mix-blend-mode:multiply;opacity:.55}
.cap{font:500 11px/1.5 'Noto Sans KR',sans-serif;color:var(--ink2)}
.c4{grid-column:span 4}.c3{grid-column:span 3}.c5{grid-column:span 5}.c6{grid-column:span 6}.c2{grid-column:span 2}.c8{grid-column:span 8}
.tall .ph{aspect-ratio:3/4}.wide .ph{aspect-ratio:16/10}.sq .ph{aspect-ratio:1}
.cols2{columns:2;column-gap:20px}
/* 심인광고 */
.ad{border:3px solid var(--ink);padding:14px;text-align:center;background:var(--paper2)}
.ad b{display:block;font:900 30px/1.1 'Noto Serif KR',serif;color:var(--coral);letter-spacing:.2em}
.ad img{width:62%;margin:8px auto;display:block;filter:grayscale(1) contrast(1.2)}
.ad .no{display:inline-block;border:2px solid var(--ink);padding:2px 10px;font:700 18px 'Noto Sans KR',sans-serif;letter-spacing:.2em}
.ad p{font-size:12.5px;margin:8px 0 0;text-align:center}

/* 고양이 지면: 글자는 흰 종이, 사진은 컬러 */
.cat .art h2,.cat .art p,.cat .cap,.cat .kick,.cat .mast .l,.cat .mast .r,.cat .rule span,.cat .ad p,.cat .ad b,.cat .ad .no,.cat .mast h1 small{color:transparent!important;text-shadow:none}
.cat .art p,.cat .art h2,.cat .cap{background:repeating-linear-gradient(transparent 0 .62em,rgba(31,26,21,.06) .62em 1.25em,transparent 1.25em 1.78em)}
.cat .mast h1{color:transparent;-webkit-text-stroke:1px rgba(31,26,21,.12)}
.cat .ph img,.cat .ad img{filter:none}
.cat .ph::after{display:none}
.cat .ph{box-shadow:0 0 0 3px var(--amber)}

/* 렌즈 테두리 · 수염 */
.lens{position:fixed;left:0;top:0;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;pointer-events:none;z-index:20;box-shadow:0 0 0 2px var(--amber),0 0 0 7px rgba(227,163,59,.25),0 0 40px 10px rgba(227,163,59,.25);opacity:0;transition:opacity .3s,width .25s,height .25s,margin .25s}
.lens.on{opacity:1}
.lens::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:22px;margin:-11px 0 0 -3.5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--amber)}
.lens.big{width:320px;height:320px;margin:-160px 0 0 -160px}
.tag{position:fixed;z-index:21;pointer-events:none;font:700 12px 'Noto Sans KR',sans-serif;background:var(--ink);color:#f2e6cb;padding:6px 9px;border-radius:3px;transform:translate(18px,150px);opacity:0;transition:opacity .2s;white-space:nowrap}
.tag.on{opacity:1}
.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:19;font:700 13px 'Noto Sans KR',sans-serif;background:var(--ink);color:#f2e6cb;padding:10px 16px;border-radius:30px;box-shadow:3px 3px 0 var(--coral);transition:opacity .6s}
.hit{cursor:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="sheet" id="paper"></div>
</div>
<div class="lens" id="lens"></div>
<div class="tag" id="tag"></div>
<p class="hint" id="hint">마우스가 심묘의 눈입니다 — 지면 위를 걸어 보세요. 글은 흰 종이로, 그림은 색으로 보입니다.</p>
<script src="../simmyo-data.js"></script>
<script>
(function(){
var P=SIMMYO_DATA.P.filter(function(p){return p.day!==2}), IMG='../assets/simmyo/s/';
var by={};P.forEach(function(p){by[p.id]=p});
function art(id,cls,big){var p=by[id];return '<article class="art hit '+cls+'" data-id="'+id+'"><div class="kick">'+p.where+' · '+p.yr+'</div><h2'+(big?'':' class="s"')+'>'+p.name+'</h2><div class="ph"><img src="'+IMG+p.img+'.webp" alt="'+p.alt+'"></div><p class="cap">'+p.alt+' · 재현 그림</p><p>'+p.f[0]+'</p>'+(big?'<p>'+(p.f[1]||'')+'</p>':'')+'</article>'}
var H='<header class="mast"><div class="l">昭和十二年 十一月 號外<br>京城府 · 每夜 發行</div><h1>심묘한 산책<small>京 城 散 步</small></h1><div class="r">값 · 멸치 한 마리<br>제 268 호</div></header>'+
'<div class="rule"><span>고양이는 글을 모르오</span><span>그림은 재현 · 장소와 연도와 지면은 사실</span><span>사람 눈 78% · 흰 종이</span></div>'+
'<div class="grid">'+
art('hwasin','c5 tall',1)+
'<div class="c4">'+art('nakrang','sq',1)+art('record','wide')+'</div>'+
'<div class="c3">'+art('jodk','tall')+
'<div class="ad hit" data-id="mid"><b>사람을 차즘</b><img src="../assets/simmyo/g/sk_peek.png" alt=""><span class="no">268</span><p>까만 고양이 한 마리. 활자 「ㄱ」 절도. 현상금 멸치 한 줌. 자정의 편집국으로.</p></div></div>'+
'<div class="c4">'+art('tram','wide',1)+'</div>'+
'<div class="c4">'+art('dansung','wide',1)+'</div>'+
'<div class="c4">'+art('mitsu','wide')+art('stadium','wide')+'</div>'+
'</div>';
var paper=document.getElementById('paper'); paper.innerHTML=H;
var cat=document.createElement('div');cat.className='cat';cat.innerHTML='<div class="sheet">'+H+'</div>';document.getElementById('stage').appendChild(cat);
var lens=document.getElementById('lens'),tag=document.getElementById('tag'),stage=document.getElementById('stage'),hint=document.getElementById('hint');
var R=130,moved=false;
document.addEventListener('mousemove',function(e){
  var r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  cat.style.clipPath='circle('+R+'px at '+x+'px '+y+'px)';
  lens.style.left=e.clientX+'px';lens.style.top=e.clientY+'px';lens.classList.add('on');
  tag.style.left=e.clientX+'px';tag.style.top=e.clientY+'px';
  var h=document.elementFromPoint(e.clientX,e.clientY),a=h&&h.closest('.hit');
  if(a){var id=a.dataset.id,p=by[id];tag.textContent=id==='mid'?'★ 자정의 편집국 · 눌러서 들어가기':'킁킁 — '+p.name+' · 눌러서 들어가기';tag.classList.add('on');lens.classList.add('big');R=160}else{tag.classList.remove('on');lens.classList.remove('big');R=130}
  if(!moved){moved=true;setTimeout(function(){hint.style.opacity=0},2500)}
});
document.addEventListener('mouseleave',function(){lens.classList.remove('on');cat.style.clipPath='circle(0 at 50% 50%)'});
paper.addEventListener('click',function(e){var a=e.target.closest('.hit');if(a)location.href='../index.html#'+(a.dataset.id==='mid'?'mid':'p-'+a.dataset.id)});
})();
</script>
</body>
</html>
