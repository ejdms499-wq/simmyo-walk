<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>심묘한 산책 · 골목</title>

<style>
/* 골목 쪽 장면: 사람들의 눈(흑백 실제 자료) ↔ 심묘의 눈(컬러 재현 그림) */
.scene{position:relative;width:100%;aspect-ratio:1600/897;overflow:hidden;background:#222;touch-action:manipulation}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.color{clip-path:ellipse(0% 0% at 50% 50%)}
.cat{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:40%;padding:0}
.cat:focus-visible{outline:2px dashed var(--honey);outline-offset:4px}
.hint{position:absolute;font:21px/1 var(--hand);color:var(--card);background:var(--ink);padding:7px 11px 5px;border-radius:3px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
.hint::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:var(--ink);border-left:0}
.hint.r::before{left:auto;right:-7px;border-right:0;border-left:6px solid var(--ink);border-left-color:var(--ink)}
.spot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font:700 15px/36px var(--display);color:var(--ink);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s;padding:0;box-shadow:0 0 0 4px rgba(244,237,220,.35)}
.open .spot{opacity:1;pointer-events:auto}
.say{position:absolute;left:3%;bottom:5%;max-width:46%;font:clamp(17px,2.1vw,25px)/1.22 var(--hand);background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:10px 14px 8px;opacity:0;transition:opacity .45s .9s;pointer-events:none}
.say::before{content:attr(data-k);display:block;font:11.5px/1.4 var(--ui);color:var(--ink2);margin-bottom:2px}
.open .say{opacity:1}
.page>.note{margin:14px auto 0;max-width:760px;background:var(--card);border:1px solid var(--ink);border-left:4px solid var(--seal);padding:12px 16px;font:15px/1.7 var(--display);color:var(--ink);transform:none;box-shadow:none}
.page>.note b{font-family:var(--ui);color:var(--seal);margin-right:4px}
.note small{display:block;color:var(--ink2);font-size:11.5px;margin-top:6px}
#back{display:none}
.scene .cface{position:absolute;left:50%;top:50%;width:44%;height:auto;object-fit:contain;transform:translate(-50%,-50%) scale(.86);opacity:0;pointer-events:none;z-index:2;will-change:transform,opacity}
#bw{transition:filter .4s}
.dim #bw{filter:brightness(.5)}
/* 엽서 */
.post{perspective:1200px;cursor:pointer}
.post .in{position:relative;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;min-height:260px}
.post.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--ink2);padding:18px 20px;box-shadow:0 6px 16px rgba(40,20,5,.14);
  background-image:linear-gradient(transparent 31px,rgba(91,79,66,.16) 32px);background-size:100% 32px;background-position:0 50px}
.face.b{transform:rotateY(180deg);background-image:none;overflow:auto}
.stamp{float:right;width:46px;height:56px;border:2px dashed var(--seal);display:grid;place-items:center;font:700 11px/1.1 var(--display);color:var(--seal);text-align:center;margin:0 0 6px 10px;transform:rotate(3deg)}
.face p{margin:0;font:23px/32px var(--hand);color:#2a2a46}
.face .from{display:block;text-align:right;margin-top:8px;font:20px/1.2 var(--hand);color:var(--ink2)}
.face h3{margin:0 0 8px;font:700 15px/1.4 var(--display)}
.face .nt{margin:0;font:15px/1.75 var(--display);color:var(--ink)}
.face .fic{font:11.5px/1.4 var(--ui);color:var(--seal);margin-top:10px}
.turn{font:12px/1 var(--ui);color:var(--ink3);margin-top:10px;text-align:right}
.wit{position:relative;margin:0;background:#fbf7ec;padding:10px 10px 12px;box-shadow:0 8px 18px -6px rgba(40,25,10,.35);transform:rotate(-1.4deg)}
.wit::before{content:'';position:absolute;left:50%;top:-10px;width:72px;height:22px;margin-left:-36px;background:rgba(217,190,130,.66);transform:rotate(2deg)}
.wit img{display:block;width:100%;height:auto;cursor:zoom-in}
.wit figcaption{font:19px/1.2 var(--hand);color:#2a2a46;margin-top:8px}
.post{position:relative;transform:rotate(1.2deg);transition:transform .3s}.post:hover{transform:rotate(0)}
.post::before{content:'';position:absolute;left:50%;top:-10px;width:80px;height:22px;margin-left:-40px;background:rgba(217,190,130,.66);transform:rotate(-2deg);z-index:3;pointer-events:none}
.face{border-radius:3px}
@media (max-width:600px){.say{display:none}.cat{min-width:60px;min-height:60px;transform:translate(-8px,-8px)}.page>.note{margin:12px 18px 0}.hint{font-size:16px;padding:5px 8px 4px}.say{font-size:16px;max-width:64%;padding:6px 9px 5px}.say::before{display:none}.note{font-size:12.5px;max-width:84%;padding:9px 10px}.spot{width:34px;height:34px;margin:-17px 0 0 -17px;line-height:30px;font-size:13px}.scene .cface{width:66%}}
</style>

      <button class="spot" id="ear" aria-label="귀 — 이곳의 소리">귀</button>

      <div class="say" id="say"></div>
      <button id="back">사람들의 눈으로</button>
    </div>
  </figure>
  <div class="modes" role="group" aria-label="보는 눈 고르기"><button id="m0" aria-pressed="true">사람들의 눈 · 실제 자료</button><button id="m1" aria-pressed="false">심묘의 눈 · 재현 그림</button></div>

  <p class="cap"><span id="capb"></span><button class="shrbtn" id="eyeshr">심묘의 눈 저장·공유</button><span>심묘의 눈: 바닥 높이, 파랑·노랑 위주로 보는 고양이 색을 흉내 낸 재현 그림</span></p>
  <div class="sheet">
    <article class="read">
      <div class="cs"><p class="catsay" id="csay"></p></div>
      <h2 class="h">이곳의 사실<span class="badge b-real">실제 자료</span></h2>
      <ol class="facts" id="facts"></ol>
      <p class="src" id="src"></p>
      <h2 class="h">심묘의 귀와 코</h2>
      <div class="sense" id="sense"></div>
      <div id="arcw"><h2 class="h">당시 지면</h2><div class="arc" id="arc"></div></div>
    </article>
    <aside class="side">
      <section id="witw" hidden>
        <h2 class="h">목격 그림<span class="badge b-fic">지어낸 이야기</span></h2>
        <figure class="wit"><button class="shrbtn mini" id="witshr">공유</button><img id="witimg" alt="" loading="lazy"><figcaption id="witcap"></figcaption></figure>
      </section>
      <section>
        <h2 class="h">목격 엽서<span class="badge b-fic">지어낸 이야기</span></h2>
        <div class="post" id="post" tabindex="0" role="button" aria-label="엽서 뒤집기">
          <div class="in">
            <div class="face f"><span class="stamp">京城<br>郵便</span><p id="pq"></p><span class="from" id="pfrom"></span></div>
            <div class="face b"><h3 id="nk"></h3><p class="nt" id="nt"></p><div class="fic">엽서 앞면과 이 메모는 지어낸 이야기</div></div>
          </div>
        </div>
        <div class="turn">엽서를 누르면 뒷면 ↻</div>
      </section>
    </aside>
  </div>
  <footer class="leave">
    <span>골목을 나서면 연재만화 한 칸이 찍히고, 들어온 자리로 돌아가오.</span>
    <span class="toast" id="toast" aria-live="polite"></span>
    <button id="go">이 골목을 나서기 →</button>
  </footer>
</div>

1:{name:'종로 전차',yr:'경성 첫 전차 1899 · 사진은 1930년대',hs:[24.8,80.3,11.6,16.7],kind:'벤치 밑에서 · 바닥 높이 25cm',say:'쇠 바퀴가 우는 소리가 나오.<br>귀가 쫑긋하오.',capb:'흑백: 종로를 달리는 전차, 당시 사진엽서 · 심묘는 합성',
