<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>심묘한 산책 · 곁골목</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap">
<style>
/* 곁골목: 산책길 옆으로 샌 골목 한 장. 골목(렌즈) 쪽과 같은 종이·같은 글꼴 */
:root{--paper:#ebe2cc;--ink:#211c17;--ink2:#5b4f42;--rule:#a3937a;--honey:#d99a2b;--seal:#a8402c;--card:#f3ecdb;
  --display:"Nanum Myeongjo","Batang",serif;--hand:"Nanum Pen Script","Gowun Dodum",cursive;--ui:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;color-scheme:light}
html,body{background:var(--paper);margin:0}
body{color:var(--ink);font-family:var(--display);padding:20px max(16px,env(safe-area-inset-left,0px)) 64px;background-image:radial-gradient(rgba(90,70,40,.06) 1px,transparent 1.2px);background-size:5px 5px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.mast{display:grid;grid-template-columns:1fr auto;align-items:end;gap:16px;border-bottom:3px double var(--ink);padding-bottom:10px}
.mast .k{display:inline-block;font:700 12px/1 var(--display);letter-spacing:.3em;color:var(--card);background:var(--ink);padding:5px 6px 5px 9px;margin-bottom:8px}
.mast h1{margin:0;font:800 clamp(30px,5vw,56px)/1.08 var(--display)}
.mast .sub{font:13px/1.6 var(--ui);color:var(--ink2);margin-top:6px}
.seal{font:700 12px/1.15 var(--display);color:var(--seal);border:2px solid var(--seal);padding:6px;text-align:center;transform:rotate(-4deg);border-radius:3px;opacity:.85}
a.back{font:13px/1 var(--ui);color:var(--ink2)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.fig{position:relative;background:#d9cfb4;border:1px solid var(--ink);box-shadow:0 18px 30px -22px rgba(40,25,10,.55)}
.fig img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;background:#2a241e}
.fig .say{position:absolute;left:4%;bottom:5%;max-width:70%;font:clamp(18px,2.2vw,25px)/1.25 var(--hand);background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:9px 14px 7px}
.fig .tag{position:absolute;right:10px;top:10px;font:12px/1 var(--ui);background:rgba(243,236,219,.92);border:1px solid var(--ink);padding:6px 8px}
.cap{font:12px/1.5 var(--ui);color:var(--ink2);margin-top:6px}
.k2{font:700 12px/1 var(--ui);letter-spacing:.12em;color:var(--seal);margin-bottom:8px}
section{margin-bottom:18px}
.sense{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.sense{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--ink);padding:12px 14px;font:14px/1.7 var(--ui)}
.card b{font:700 15px/1.3 var(--display);display:block;margin-bottom:4px}
.card img{width:100%;height:auto;display:block;border:1px solid var(--rule);margin-bottom:8px}
.card small,.src{font:11.5px/1.5 var(--ui);color:var(--ink2);display:block;margin-top:4px}
.fact p{margin:0 0 8px;font:15px/1.8 var(--display)}
.arc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.arc figure{margin:0}.arc img{width:100%;height:auto;display:block;border:1px solid var(--ink2);filter:grayscale(.15)}
.arc figcaption{font:11.5px/1.45 var(--ui);color:var(--ink2);margin-top:4px}
.note{background:var(--card);border:1px solid #8d7d63;padding:12px 14px;font:21px/1.2 var(--hand);color:#2a2a46;transform:rotate(-1deg);box-shadow:0 3px 8px rgba(40,20,5,.2)}
.note small{display:block;font:11.5px/1.4 var(--ui);color:var(--seal);margin-top:8px}
.ppl{display:grid;gap:10px}
.next{display:flex;justify-content:space-between;align-items:center;border-top:3px double var(--ink);padding-top:12px;gap:12px;flex-wrap:wrap;font:13px/1.4 var(--ui);color:var(--ink2)}
.next button{font:700 15px/1 var(--display);background:var(--ink);color:var(--card);border:0;padding:12px 16px;cursor:pointer}
.next button:focus-visible{outline:2px solid var(--honey);outline-offset:3px}
.sndbtn{position:fixed;left:14px;bottom:16px;z-index:60;font:12.5px/1 var(--ui);background:rgba(243,236,219,.92);color:#211c17;border:1px solid #211c17;border-radius:16px;padding:8px 12px 7px 30px;cursor:pointer}
.sndbtn::before{content:'';position:absolute;left:11px;top:50%;width:12px;height:12px;margin-top:-6px;background:#211c17;clip-path:polygon(0 30%,35% 30%,80% 0,80% 100%,35% 70%,0 70%)}
.sndbtn[aria-pressed=false]{opacity:.7;text-decoration:line-through}
.lbls{display:flex;gap:6px;flex-wrap:wrap}.lb{font:11.5px/1 var(--ui);border:1px solid var(--rule);padding:5px 7px;color:var(--ink2)}
</style></head><body>
<div class="wrap">
  <header class="mast"><div><div class="k">京城野錄 · 곁골목</div><h1 id="nm"></h1><div class="sub" id="sub"></div></div><div class="seal">尋<br>猫</div></header>
  <a class="back" id="backl" href="../road/index.html">← 산책길로</a>
  <div class="grid">
    <main>
      <div class="fig"><img id="img" alt=""><span class="tag" id="tag"></span><div class="say" id="say"></div></div>
      <div class="cap" id="cap"></div>
      <section style="margin-top:18px"><div class="k2">심묘의 귀와 코</div><div class="sense" id="sense"></div></section>
      <section><div class="k2">당시 지면 · 실제 자료</div><div class="arc" id="arc"></div></section>
    </main>
    <aside>
      <section class="fact"><div class="k2">이곳의 사실</div><div id="facts"></div><span class="src" id="src"></span></section>
      <section id="pplw"><div class="k2">그 시절 사람들</div><div class="ppl" id="ppl"></div></section>
      <section><div class="k2">심묘 수첩</div><div class="note" id="note"></div></section>
      <div class="lbls"><span class="lb">실제 자료</span><span class="lb">재현 그림</span><span class="lb">지어낸 이야기</span></div>
    </aside>
  </div>
  <div class="next"><span>곁골목을 나서면 다시 원래 산책길, 들어온 자리로 돌아가오.</span><button id="go">산책길로 돌아가기 →</button></div>
</div>
<button class="sndbtn" aria-pressed="true">소리 켬</button>
<script src="../../simmyo-data.js"></script>
<script src="../../simmyo-data-fix.js"></script>
<script src="../sfx.js"></script>
<script>
(function(){
var R='../../',IMG=R+'assets/simmyo/s/';
var qs=new URLSearchParams(location.search),id=qs.get('s'),at=+qs.get('at')||0;
var P=(window.SIMMYO_DATA&&SIMMYO_DATA.P||[]).filter(function(p){return p.id===id})[0];
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var back='../road/index.html'+(at?'?at='+Math.round(at):'');$('backl').href=back;$('go').onclick=function(){location.href=back};
if(!P){$('nm').textContent='이 곁골목은 아직 없소';return}
document.title='심묘한 산책 · 곁골목 · '+P.name;
$('nm').textContent=P.name;$('sub').textContent=P.where+' · '+P.yr;
/* 예전 심묘 그림(지금 심묘와 생김새가 다름)은 새 그림이 올 때까지 실제 자료로 대신 */
var NEW=window.SIDE_ART&&SIDE_ART[id];var useArc=!P.ph&&!NEW&&P.arc&&P.arc.length;var real=!!P.ph||useArc;
$('img').src=NEW?R+NEW.src.replace('../../',''):(useArc?R+P.arc[0].img:IMG+P.img+'.webp');$('img').alt=(NEW?NEW.alt:(useArc?P.arc[0].cap:(P.alt||P.name)))+(real?' (옛 자료)':' (재현 그림)');
$('tag').textContent=real?'사람들의 눈 · 실제 자료':'심묘가 본 곳 · 재현 그림';
var says=[].concat(P.say||[]),si=0;$('say').textContent=says[0]||'';
if(says.length>1)setInterval(function(){si=(si+1)%says.length;$('say').textContent=says[si]},4200);
$('cap').textContent=NEW?'그림: '+NEW.alt+' — 재현 그림, 심묘는 지어낸 고양이':useArc?'「'+P.arc[0].cap+'」 · '+P.arc[0].src+' — 실제 자료':(P.alt||'')+' — 실제 자료';
var s='';
if(P.ear)s+='<div class="card" data-k="ear"><b>귀 · 이곳의 소리</b>'+esc(P.ear.t)+'</div>';
if(P.nose)s+='<div class="card" data-k="nose">'+(P.nose.img&&P.nose.ph?'<img src="'+IMG+P.nose.img+'.webp" alt="'+esc(P.nose.alt)+(P.nose.ph?' (옛 자료)':' (재현 그림)')+'">':'')+'<b>코 · 이곳의 냄새</b>'+esc(P.nose.t)+(P.nose.src?'<small>'+esc(P.nose.src)+'</small>':'')+'</div>';
$('sense').innerHTML=s;
[].forEach.call(document.querySelectorAll('.card[data-k]'),function(c){c.style.cursor='pointer';c.addEventListener('click',function(){window.snd&&snd(c.dataset.k==='ear'?'chime':'sniff')})});
$('arc').innerHTML=(P.arc||[]).map(function(a){return '<figure><img src="'+R+a.img+'" alt="'+esc(a.cap)+'" loading="lazy"><figcaption>「'+esc(a.cap)+'」 · '+esc(a.src)+'</figcaption></figure>'}).join('')||'<p class="cap">이 곁골목의 옛 지면은 아직 찾는 중이오.</p>';
$('facts').innerHTML=(P.f||[]).map(function(t){return '<p>'+esc(t)+'</p>'}).join('');$('src').textContent=P.src||'';
if(P.people&&P.people.length){$('ppl').innerHTML=P.people.map(function(q){return '<div class="card"><b>'+esc(q.k)+' · '+esc(q.t)+'</b>'+(q.li||[]).map(esc).join(' ')+'<small>'+esc(q.src)+'</small></div>'}).join('')}else $('pplw').remove();
$('note').innerHTML=P.note?esc(P.note.t)+'<small>지어낸 이야기 · '+esc(P.note.k)+'</small>':'';
try{var v=JSON.parse(localStorage.getItem('simmyo_side')||'[]');if(v.indexOf(id)<0){v.push(id);localStorage.setItem('simmyo_side',JSON.stringify(v))}}catch(e){}
})();
</script>
</body></html>
