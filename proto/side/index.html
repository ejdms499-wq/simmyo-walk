<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>심묘한 산책 · 곁골목</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../sub.css">
<style>
/* 곁골목: 심묘가 노는 장면 */
.fig{position:relative}
.fig #img{display:block;width:100%;height:auto;max-height:80vh;object-fit:contain}
.fig.live #img{display:none}
#scn{position:relative;width:100%;overflow:hidden;margin:0 auto}
.stg{position:absolute;left:0;top:0;transform-origin:0 0}
.stg .bgi{position:absolute;inset:0;width:100%;height:100%;display:block}
.stg .cat{position:absolute;cursor:pointer}
.stg .csh{position:absolute;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(30,18,8,.55),rgba(30,18,8,0))}
.stg .csay{position:absolute;transform:translate(-50%,-100%);opacity:0;transition:opacity .3s;background:#f6efde;border:3px solid #211c17;border-radius:24px;padding:8px 18px 6px;font-family:var(--hand);line-height:1.1;white-space:nowrap;z-index:3;pointer-events:none}
.stg .csay.on{opacity:1}
.stage.tall{max-width:620px;margin-left:auto;margin-right:auto}
.fig.live{background:transparent;box-shadow:none;outline:0}
.fig.live #scn{box-shadow:0 22px 40px -28px rgba(40,25,10,.7);outline:1px solid rgba(33,28,23,.55)}
</style></head><body><script src="../hop.js"></script>
<header class="bar">
  <a class="bk" data-hop id="backl" href="../road/index.html">← 산책길</a>
  <div class="ttl"><span class="kick">京城野錄 · 곁골목</span><h1 id="nm"></h1></div>
  <div class="meta"><span class="ys" id="ys"></span><button class="sndbtn" aria-pressed="true">소리</button></div>
</header>
<div class="page">
  <figure class="stage fig" id="fig"><div id="scn"></div><img id="img" alt=""></figure>
  <p class="cap"><span id="cap"></span><span style="display:flex;gap:10px;align-items:center"><span id="tag"></span><button class="shrbtn" id="sshr" hidden>저장·공유</button></span></p>
  <div class="sheet">
    <article class="read">
      <div class="cs"><p class="catsay" id="say"></p></div>
      <h2 class="h">이곳의 사실<span class="badge b-real">실제 자료</span></h2>
      <ol class="facts" id="facts"></ol>
      <p class="src" id="src"></p>
      <h2 class="h">심묘의 귀와 코</h2>
      <div class="sense" id="sense"></div>
      <div id="arcw"><h2 class="h">당시 지면</h2><div class="arc" id="arc"></div></div>
    </article>
    <aside class="side">
      <section><h2 class="h">심묘 수첩<span class="badge b-fic">지어낸 이야기</span></h2><div class="note" id="note"></div></section>
      <section id="pplw"><h2 class="h">그 시절 사람들</h2><div class="ppl" id="ppl"></div></section>
    </aside>
  </div>
  <footer class="leave"><span>곁골목을 나서면 들어온 자리로 돌아가오.</span><button id="go">산책길로 돌아가기 →</button></footer>
</div>
<script src="../../simmyo-data.js"></script>
<script src="../../simmyo-data-fix.js"></script>
<script src="new-places.js"></script>
<script src="new-places2.js"></script>
<script src="../side-art.js"></script>
<script src="../sfx.js?v=7"></script>
<script src="../share.js?v=3"></script>
<script src="scene.js?v=c4"></script>
<script>
(function(){
var R='../../',IMG=R+'assets/simmyo/s/';
var qs=new URLSearchParams(location.search),id=qs.get('s'),at=+qs.get('at')||0;
var P=(window.SIMMYO_DATA&&SIMMYO_DATA.P||[]).filter(function(p){return p.id===id})[0];
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var back=qs.get('from')==='album'?'../album/index.html':'../road/index.html'+(at?'?at='+Math.round(at):'');$('backl').href=back;if(qs.get('from')==='album'){$('backl').textContent='← 화첩';$('go').textContent='화첩으로 돌아가기 →'}$('go').onclick=function(){var r=this.getBoundingClientRect();hopTo(back,r.left+r.width/2,r.top+r.height/2)};
if(!P){$('nm').textContent='이 곁골목은 아직 없소';return}
document.title='심묘한 산책 · 곁골목 · '+P.name;
$('nm').textContent=P.name;$('ys').innerHTML=String(P.yr).replace(/\s*~\s*/,'~<br>').replace(/^(\d{4})$/,'$1<br>년');
/* 예전 심묘 그림(지금 심묘와 생김새가 다름)은 새 그림이 올 때까지 실제 자료로 대신 */
var NEW=window.SIDE_ART&&SIDE_ART[id];var useArc=!P.ph&&!NEW&&P.arc&&P.arc.length;var real=!!P.ph||useArc;
var LIVE=!!(window.startScene&&window.SCENE_IDS&&SCENE_IDS.indexOf(id)>=0);if(!LIVE)$('img').src=NEW?R+NEW.src.replace('../../',''):(useArc?R+P.arc[0].img:IMG+P.img+'.webp');$('img').alt=(NEW?NEW.alt:(useArc?P.arc[0].cap:(P.alt||P.name)))+(real?' (옛 자료)':' (재현 그림)');
$('tag').textContent=P.where;if(NEW){var sb=$('sshr');sb.hidden=false;sb.setAttribute('data-share-src',R+NEW.src.replace('../../',''));sb.setAttribute('data-share-title',P.name);sb.setAttribute('data-share-caption',modern([].concat(P.say||[''])[0]))}
var host=$('scn'),live=window.startScene&&startScene(id,host);if(live){var mh=innerHeight-(innerWidth<600?140:150),stg=host.querySelector('.stg'),ar=stg.offsetWidth/Math.max(1,stg.offsetHeight);if(innerWidth>=600){var sw=Math.max(320,mh*ar);host.style.maxWidth=sw+'px';if(stg.offsetHeight<=stg.offsetWidth)document.querySelector('.page').style.maxWidth=Math.min(1180,Math.max(960,sw+40))+'px'}$('fig').classList.add('live');if(host.querySelector('.stg').offsetHeight>host.querySelector('.stg').offsetWidth)$('fig').classList.add('tall');window.dispatchEvent(new Event('resize'))}
function modern(t){[['끈소','끊소'],['만소','많소'],['겟소','겠소'],['잇소','있소'],['잇고','있고'],['갓소','같소'],['엇소','었소'],['앗소','았소'],['업소','없소'],['업더','없더'],['아즉','아직'],['우에','위에'],['압','앞'],['안즌','앉은'],['몰랏','몰랐'],['엿소','였소']].forEach(function(r){t=t.split(r[0]).join(r[1])});return t}
var says=[].concat(P.say||[]);var line=P.night||says[1]||says[0]||'';$('say').textContent=line?'「'+modern(line)+'」':'';
$('cap').innerHTML=live?'<b>재현 그림</b> · 심묘를 누르면 대꾸하오':NEW?'<b>재현 그림</b> · '+esc(NEW.alt):useArc?'<b>실제 자료</b> · 「'+esc(P.arc[0].cap)+'」 '+esc(P.arc[0].src):'<b>실제 자료</b> · '+esc(P.alt||'');
var s='';
if(P.ear)s+='<button data-k="ear"><i>귀</i><span>'+esc(P.ear.t)+'</span></button>';
if(P.nose)s+='<button data-k="nose"><i>코</i><span>'+esc(P.nose.t)+(P.nose.src?'<small>'+esc(P.nose.src)+'</small>':'')+'</span></button>';
$('sense').innerHTML=s;
var EAR={expo:'whoosh',hwasin:'tink',jodk:'horn',bingsu:'ice',sakura:'chime',stadium:'whoosh',bonjeong:'chime',mitsu:'drip',seoulst:'bell',post:'tink',photo:'pop',barber:'paper',books:'paper',market:'crunch',well:'splash',herb:'paper',cotton:'paper',noodle:'paper',muk:'chime',yeot:'clink',gomu:'tink',smithy:'clink',dadeum:'tink',rick:'drip',kite:'whoosh',kimchi:'crunch'};
[].forEach.call(document.querySelectorAll('.sense button'),function(c){c.addEventListener('click',function(){window.snd&&snd(c.dataset.k==='ear'?(EAR[id]||'chime'):'sniff')})});
var arcs=(P.arc||[]).slice();if(P.nose&&P.nose.img&&P.nose.ph)arcs.push({img:'assets/simmyo/s/'+P.nose.img+'.webp',cap:P.nose.alt,src:'실제 자료'});
if(arcs.length)$('arc').innerHTML=arcs.map(function(a){return '<figure><img src="'+R+a.img+'" alt="'+esc(a.cap)+'" loading="lazy"><figcaption>「'+esc(a.cap)+'」 · '+esc(a.src)+'</figcaption></figure>'}).join('');else $('arcw').remove();
$('facts').innerHTML=(P.f||[]).map(function(t){return '<li>'+esc(t)+'</li>'}).join('');$('src').textContent=P.src||'';
if(P.people&&P.people.length){$('ppl').innerHTML=P.people.map(function(q){return '<div><b>'+esc(q.k)+' · '+esc(q.t)+'</b>'+(q.li||[]).map(esc).join(' ')+'<small>'+esc(q.src)+'</small></div>'}).join('')}else $('pplw').remove();
$('note').innerHTML=P.note?esc(P.note.t)+'<small>지어낸 이야기 · '+esc(P.note.k)+'</small>':'';
try{var v=JSON.parse(localStorage.getItem('simmyo_side')||'[]');if(v.indexOf(id)<0){v.push(id);localStorage.setItem('simmyo_side',JSON.stringify(v))}}catch(e){}
})();
</script>
</body></html>
