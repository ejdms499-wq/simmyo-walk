<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>심묘한 산책 · 심묘 화첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../sub.css">
<style>
/* 심묘 화첩: 옛 신문 만화 한 칸씩 모은 접이식 화첩 */
.ahead{max-width:1180px;margin:0 auto;padding:34px max(20px,env(safe-area-inset-left)) 0 max(20px,env(safe-area-inset-right));display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end}
.ahead .no{grid-row:1/3;width:86px;height:86px;border:3px double var(--ink);display:grid;place-items:center;font:800 15px/1.2 var(--display);text-align:center;background:var(--card);transform:rotate(-4deg)}
.ahead h2{margin:0;font:800 clamp(30px,4.4vw,48px)/1.05 var(--display);letter-spacing:-.02em}
.ahead p{margin:0;font:15px/1.7 var(--display);color:var(--ink2);max-width:640px}
.tabs{max-width:1180px;margin:22px auto 0;padding:0 max(20px,env(safe-area-inset-left));display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font:13.5px/1 var(--ui);padding:9px 14px 8px;border:1px solid var(--ink);background:var(--card);border-radius:999px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.grid{max-width:1180px;margin:26px auto 0;padding:0 max(20px,env(safe-area-inset-left)) 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:34px 28px}
.pn{margin:0;cursor:pointer;position:relative;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.pn:nth-child(3n+1){transform:rotate(-.8deg)}.pn:nth-child(3n+2){transform:rotate(.6deg)}.pn:nth-child(3n){transform:rotate(-.3deg)}
.pn:hover,.pn:focus-visible{transform:rotate(0) translateY(-5px)}
.pn .fr{background:#fbf6e8;padding:8px;box-shadow:0 10px 22px -10px rgba(40,25,10,.5);outline:1px solid rgba(33,28,23,.25)}
.pn img{display:block;width:100%;aspect-ratio:1232/928;object-fit:cover}
.pn figcaption{display:flex;align-items:baseline;gap:10px;margin-top:11px}
.pn .n{font:700 12px/1 var(--ui);color:var(--seal);letter-spacing:.08em;flex:none}
.pn .t{font:700 17px/1.3 var(--display)}
.pn .q{display:block;font:21px/1.2 var(--hand);color:#2a2a46;margin-top:4px}
.pn .y{margin-left:auto;font:11.5px/1 var(--ui);color:var(--ink3);flex:none}
/* 크게 보기 */
#big{position:fixed;inset:0;z-index:50;background:rgba(29,25,21,.88);display:none;align-items:center;justify-content:center;padding:20px}
#big.on{display:flex}
#big .bx{max-width:min(1100px,100%);width:100%;background:var(--paper);padding:14px;box-shadow:0 30px 60px rgba(0,0,0,.4)}
#big img{display:block;width:100%;max-height:72vh;object-fit:contain;background:#e9dcc0}
#big .cap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:0 4px}
#big .cap b{font:800 20px/1.2 var(--display)}
#big .cap q{font:23px/1.2 var(--hand);color:#2a2a46;quotes:'「' '」'}
#big .cap .sp{flex:1}
#big .cap button{font:700 14px/1 var(--display);padding:12px 16px;border:0;cursor:pointer;border-radius:999px}
#big .go{background:var(--ink);color:var(--card)}
#big .x{background:transparent;border:1px solid var(--ink)!important;color:var(--ink)}
#big .nav{position:fixed;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:0;background:rgba(243,236,219,.9);font:22px/1 var(--ui);cursor:pointer}
#big .pv{left:14px}#big .nx{right:14px}
@media (max-width:640px){.grid{grid-template-columns:1fr;gap:26px}.ahead .no{width:64px;height:64px;font-size:12px}#big{padding:10px}#big .nav{display:none}#big .cap .sp{display:none}#big .cap button{flex:1}}
</style></head><body><script src="../hop.js"></script>
<header class="bar">
  <a class="bk" data-hop id="backl" href="../road/index.html">← 산책길</a>
  <div class="ttl"><span class="kick">京城野錄 · 附錄</span><h1>심묘 화첩</h1></div>
  <div class="meta"><span class="ys">畵帖<br>第一</span><button class="sndbtn" aria-pressed="true">소리</button></div>
</header>
<div class="ahead"><div class="no">경성<br>사람들의<br>일</div><h2>심묘가 끼어든 경성의 하루</h2><p>물장수 새벽부터 다듬이질 밤까지, 경성 사람들이 일하던 자리마다 까만 고양이가 먼저 와 있었소. 한 칸을 누르면 크게 보이고, 그 골목으로 들어가 심묘를 따라가 볼 수 있소.</p></div>
<div class="tabs" role="group" aria-label="때 고르기"><button data-t="all" aria-pressed="true">전부</button><button data-t="am">아침·낮</button><button data-t="pm">저녁·밤</button><button data-t="wi">겨울</button></div>
<div class="grid" id="grid"></div>
<footer class="leave" style="max-width:1180px;margin:40px auto 0;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))"><span>재현 그림 · 배경은 미드저니, 심묘는 챗GPT로 그려 합친 것. 사실은 각 골목 쪽에 출처와 함께.</span><button id="go">산책길로 돌아가기 →</button></footer>
<div id="big" role="dialog" aria-modal="true" aria-label="화첩 크게 보기"><button class="nav pv" aria-label="앞 칸">‹</button><div class="bx"><img alt=""><div class="cap"><b></b><q></q><span class="sp"></span><button class="x">닫기</button><button class="go">이 골목 들어가기 →</button></div></div><button class="nav nx" aria-label="다음 칸">›</button></div>
<script src="../../simmyo-data.js"></script>
<script src="../side/new-places2.js"></script>
<script src="../side-art.js"></script>
<script src="../sfx.js?v=5"></script>
<script>
(function(){
var IDS=[['well','am'],['herb','am'],['cotton','am'],['noodle','am'],['yeot','am'],['gomu','am'],['smithy','pm'],['kimchi','am'],['rick','pm'],['dadeum','pm'],['muk','wi'],['kite','wi']];
var P={};(window.SIMMYO_DATA&&SIMMYO_DATA.P||[]).forEach(function(p){P[p.id]=p});
var L=IDS.filter(function(q){return P[q[0]]&&window.SIDE_ART&&SIDE_ART[q[0]]});
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var g=document.getElementById('grid');
g.innerHTML=L.map(function(q,i){var p=P[q[0]],a=SIDE_ART[q[0]];return '<figure class="pn" tabindex="0" data-i="'+i+'" data-t="'+q[1]+'"><div class="fr"><img src="../../'+a.src+'" alt="'+esc(a.alt)+'" loading="lazy"></div><figcaption><span class="n">第'+(i+1)+'</span><span><span class="t">'+esc(p.name)+'</span><span class="q">「'+esc((p.say||[''])[0])+'」</span></span><span class="y">'+esc(p.yr)+'</span></figcaption></figure>'}).join('');
var big=document.getElementById('big'),cur=0;
function show(i){cur=(i+L.length)%L.length;var q=L[cur],p=P[q[0]],a=SIDE_ART[q[0]];big.querySelector('img').src='../../'+a.src;big.querySelector('img').alt=a.alt;big.querySelector('b').textContent=p.name;big.querySelector('q').textContent=(p.say||[''])[0];big.classList.add('on');window.snd&&snd('paper')}
[].forEach.call(g.querySelectorAll('.pn'),function(el){el.onclick=function(){show(+el.dataset.i)};el.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();show(+el.dataset.i)}}});
big.querySelector('.x').onclick=function(){big.classList.remove('on')};big.onclick=function(e){if(e.target===big)big.classList.remove('on')};
big.querySelector('.pv').onclick=function(){show(cur-1)};big.querySelector('.nx').onclick=function(){show(cur+1)};
addEventListener('keydown',function(e){if(!big.classList.contains('on'))return;if(e.key==='Escape')big.classList.remove('on');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
big.querySelector('.go').onclick=function(){var r=this.getBoundingClientRect();hopTo('../side/index.html?s='+L[cur][0]+'&from=album',r.left+r.width/2,r.top+r.height/2)};
[].forEach.call(document.querySelectorAll('.tabs button'),function(b){b.onclick=function(){[].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.setAttribute('aria-pressed',x===b)});[].forEach.call(g.querySelectorAll('.pn'),function(el){el.hidden=!(b.dataset.t==='all'||el.dataset.t===b.dataset.t)})}});
var at=new URLSearchParams(location.search).get('at');var back='../road/index.html'+(at?'?at='+at:'');document.getElementById('backl').href=back;
document.getElementById('go').onclick=function(){var r=this.getBoundingClientRect();hopTo(back,r.left+r.width/2,r.top+r.height/2)};
})();
</script></body></html>
