@media (max-width:820px){

  #big .nav{display:none}#big .cap button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    '<div class="who"><b>이번 회 나온 곳</b> · '+(e.walk?esc(e.place)+' (산책길 '+e.walk+'번째 골목) · <a data-hop href="../lens/index.html?p='+e.walk+'">이 골목 사실 자료 보기 →</a> · <a data-hop href="../play/index.html?p='+e.walk+'">심묘와 한 판 →</a>':e.p.map(function(q){return esc((P[q[0]]||{}).name||q[0])}).join(' · '))+'</div>'+
