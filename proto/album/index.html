<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta property="og:title" content="연재만화 「심묘」 — 심묘한 산책"><meta property="og:description" content="1930년대 경성 신문에 실린 듯한 네 칸 연재만화. 경성 사람들이 일하던 자리마다 까만 고양이가 먼저 와 있었다."><meta property="og:image" content="https://ejdms499-wq.github.io/simmyo-walk/proto/share/og/art-s15.jpg"><meta name="twitter:card" content="summary_large_image">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>심묘한 산책 · 연재만화 「심묘」</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap">
<style>
/* 1930년대 신문 지면에 실린 네 칸 연재만화 */
:root{--np:#e9dcbd;--np2:#dfcfa9;--ink:#1f1a15;--ink2:#4d4236;--ink3:#857560;--seal:#a8402c;--display:"Nanum Myeongjo",serif;--hand:"Nanum Pen Script",cursive;--ui:"Gowun Dodum",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#2b241d}
body{color:var(--ink);font-family:var(--display);min-height:100vh;padding:clamp(10px,3vw,34px) clamp(8px,3vw,34px) 40px}
a{color:inherit}
.paper{max-width:980px;margin:0 auto;background:var(--np);position:relative;padding:clamp(14px,3vw,34px);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
  background-image:radial-gradient(rgba(70,50,25,.09) 1px,transparent 1.3px),linear-gradient(90deg,rgba(120,90,40,.05),transparent 20%,transparent 80%,rgba(120,90,40,.07));background-size:4px 4px,100% 100%}
.paper::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(120,80,30,.28)}
/* 제호 */
.top{display:flex;justify-content:space-between;align-items:center;font:12px/1 var(--ui);color:var(--ink2);border-bottom:1px solid var(--ink);padding-bottom:6px}
.top a{text-decoration:none;padding:6px 0}
.mast{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:10px 0 8px;border-bottom:5px double var(--ink)}
.mast .t{font:800 clamp(36px,8vw,74px)/1 var(--display);letter-spacing:.06em;text-align:center}
.mast .bx{border:2px solid var(--ink);padding:6px 8px;font:700 12px/1.35 var(--display);text-align:center;min-width:76px}
.mast .bx b{display:block;font-size:20px;color:var(--seal)}
.sub{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:12.5px/1 var(--ui);color:var(--ink2);border-bottom:1px solid var(--ink);padding:7px 0}
/* 회차 고르기 */
.eps{display:flex;gap:8px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap}
.eps button{font:700 14px/1 var(--display);padding:9px 14px 8px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;color:var(--ink)}
.eps button[aria-current=true]{background:var(--ink);color:var(--np)}
/* 지면: 왼쪽 단(글) + 오른쪽 연재만화 */
.sheet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:28px;margin-top:16px}
.col{border-right:1px solid var(--ink);padding-right:22px}
.col h2{margin:0 0 4px;font:800 clamp(24px,3.4vw,34px)/1.2 var(--display);letter-spacing:-.01em}
.col .k{font:12px/1 var(--ui);letter-spacing:.2em;color:var(--seal);margin-bottom:10px}
.col p{font:15.5px/1.95 var(--display);margin:0 0 12px;text-align:justify}
.col p:first-of-type::first-letter{float:left;font:800 54px/.9 var(--display);margin:6px 8px 0 0}
.col .who{margin-top:18px;border-top:1px solid var(--ink3);padding-top:10px;font:12.5px/1.7 var(--ui);color:var(--ink2)}
.col .who b{color:var(--ink)}
.col .ad{margin-top:20px;border:2px solid var(--ink);padding:12px;text-align:center}
.col .ad .h{font:800 20px/1.2 var(--display)}
.col .ad .s{font:13px/1.6 var(--ui);color:var(--ink2);margin-top:4px}
/* 네 칸 */
.strip{border:3px solid var(--ink);background:#f2e7cc;padding:10px}
.strip .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.strip .head b{font:800 22px/1 var(--display)}.strip .head span{font:12px/1 var(--ui);color:var(--ink2)}
.pn{position:relative;margin:0 0 10px;border:2.5px solid var(--ink);cursor:zoom-in;background:#d9c9a3;overflow:hidden}
.pn:last-child{margin-bottom:0}
.pn img{display:block;width:100%;aspect-ratio:1232/880;object-fit:cover;object-position:50% 70%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pn:hover img{transform:scale(1.025)}
.pn .no{position:absolute;left:0;top:0;width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--np);font:800 17px/1 var(--display)}
.pn .nar{position:absolute;left:34px;top:0;max-width:calc(100% - 34px - 10px);background:#f6ecd2;border:2px solid var(--ink);border-left:0;border-top:0;padding:6px 10px 6px;font:700 14px/1.45 var(--display)}
.pn .bal{position:absolute;right:12px;bottom:12px;max-width:62%;background:#fffaf0;border:2px solid var(--ink);border-radius:20px;padding:6px 14px 5px;font:22px/1.15 var(--hand);color:#1f1a15}
.pn .bal::after{content:'';position:absolute;left:22px;top:-11px;width:14px;height:14px;background:#fffaf0;border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
.cont{display:flex;justify-content:flex-end;margin-top:10px}
.cont span{font:800 15px/1 var(--display);border:2px solid var(--seal);color:var(--seal);padding:7px 10px;transform:rotate(-4deg)}
.foot{margin-top:22px;border-top:3px double var(--ink);padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font:12.5px/1.6 var(--ui);color:var(--ink2)}
.foot button{font:700 15px/1 var(--display);padding:13px 18px;border:0;background:var(--ink);color:var(--np);cursor:pointer;border-radius:999px}
/* 크게 보기 */
#big{position:fixed;inset:0;z-index:50;background:rgba(20,16,12,.9);display:none;align-items:center;justify-content:center;padding:16px}
#big.on{display:flex}
#big .bx{max-width:min(1060px,100%);width:100%;background:var(--np);padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
#big img{display:block;width:100%;max-height:70vh;object-fit:contain;background:#d9c9a3;border:2px solid var(--ink)}
#big .cap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
#big .cap .tx{flex:1;min-width:200px}
#big .cap b{display:block;font:800 18px/1.3 var(--display)}
#big .cap q{display:block;font:22px/1.2 var(--hand);quotes:'「' '」';color:#2a2a46}
#big .cap button{font:700 14px/1 var(--display);padding:12px 15px;border:1.5px solid var(--ink);cursor:pointer;border-radius:999px;background:transparent;color:var(--ink)}
#big .cap .go{background:var(--ink);color:var(--np)}
#big .nav{position:fixed;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:0;background:rgba(233,220,189,.92);font:24px/1 var(--ui);cursor:pointer}
#big .pv{left:12px}#big .nx{right:12px}
@media (max-width:820px){
  .sheet{grid-template-columns:1fr}.col{border-right:0;padding-right:0;border-bottom:1px solid var(--ink);padding-bottom:16px;order:2}.strip{order:1}
  .mast{grid-template-columns:1fr}.mast .bx{display:none}
  .pn .nar{font-size:12.5px}.pn .bal{font-size:19px;max-width:70%}
  #big .nav{display:none}#big .cap button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><script src="../hop.js"></script>
<div class="paper">
  <div class="top"><a data-hop id="backl" href="../road/index.html">← 산책길로</a><span>京城野錄 · 附錄 連載漫畵</span><button class="sndbtn" aria-pressed="true" style="font:12px/1 var(--ui);background:none;border:1px solid var(--ink);border-radius:14px;padding:6px 10px;cursor:pointer">소리</button></div>
  <div class="mast"><div class="bx">連載漫畵<b id="epno">第一回</b></div><div class="t">심 묘</div><div class="bx">경성 사람들의<br>하루<b id="epwhen">아침</b></div></div>
  <div class="sub"><span>수배 고양이 「심묘」가 경성 골목에 끼어든 이야기 · 지어낸 이야기</span><span>그림: 경성야록 삽화부</span></div>
  <nav class="eps" id="eps" aria-label="회차 고르기"></nav>
  <div class="sheet">
    <article class="col" id="col"></article>
    <section class="strip" id="strip" aria-label="네 칸 만화"></section>
  </div>
  <div class="foot"><span>칸을 누르면 크게 보이고, 그 골목으로 들어가 심묘를 따라갈 수 있소. 사실 자료는 골목 쪽에 출처와 함께 있소.</span><button id="go">산책길로 돌아가기 →</button></div>
</div>
<div id="big" role="dialog" aria-modal="true" aria-label="한 칸 크게 보기"><button class="nav pv" aria-label="앞 칸">‹</button><div class="bx"><img alt=""><div class="cap"><div class="tx"><b></b><q></q></div><button class="x">닫기</button><button class="shr">저장·공유</button><button class="go">이 골목 들어가기 →</button></div></div><button class="nav nx" aria-label="다음 칸">›</button></div>
<script src="../../simmyo-data.js"></script>
<script src="../side/new-places2.js"></script>
<script src="../side-art.js"></script>
<script src="../sfx.js?v=6"></script>
<script src="../share.js"></script>
<script>
(function(){
var EP=[
 {no:'第一回',when:'아침',title:'새벽부터 바쁜 손님',lead:'물장수 지게보다 먼저 우물가에 닿은 것은 까만 고양이였다. 그날 아침 경성의 일터마다 같은 손님이 다녀갔다는 제보가 편집국에 잇따라 들어왔다.',
  body:'약방 주인은 서랍 하나가 늘 열려 있다 했고, 솜틀집에서는 새로 튼 솜 한가운데가 고양이 모양으로 꺼져 있었다 한다. 국숫집에서는 널어 둔 국숫발 끝 한 가닥이 늘 짧았다.',
  p:[['well','새벽 네 시. 북청 물장수보다 먼저 온 손님.'],['herb','구리개 약방. 서랍 백 개 중 하나가 늘 열린 까닭.'],['cotton','솜틀집 주인 왈, 오늘 솜이 왜 이리 따뜻하오?'],['noodle','국숫발 사이 까만 얼굴. 한 가닥만 먹었다더라.']]},
 {no:'第二回',when:'한낮',title:'골목의 쇳소리',lead:'한낮의 골목은 쇳소리로 시끄러웠다. 엿장수 가위, 대장간 망치, 김장 날 항아리 뚜껑. 그 소리 사이를 까만 것이 태연히 지나갔다.',
  body:'엿장수 수레에서는 헌 고무신 한 짝이 사라졌고, 고무신 가게에서는 아이 신 한 짝이 자꾸 선반에서 떨어졌다. 대장장이는 모루 밑에 웅크린 것이 망치 소리에도 꿈쩍 않더라고 했다.',
  p:[['yeot','철컥철컥 가위 소리. 헌 신 한 짝이 엿값이라는데.'],['gomu','새 고무신 가게. 딱 맞는 신은 사람 것이 아니었다.'],['smithy','땅! 망치 소리에도 화덕 앞자리는 안 내준다.'],['kimchi','김장 날. 빈 독 하나가 끝내 비지 않았다.']]},
 {no:'第三回',when:'밤',title:'비 오고 눈 오는 밤',lead:'해가 지자 비가 왔고, 비가 그치자 눈이 왔다. 인력거꾼도, 다듬이질하던 며느리도, 메밀묵 장수도 그 밤에 같은 고양이를 보았다고 적어 보냈다.',
  body:'정월 보름에는 언덕 아래 기와지붕에 걸린 연 하나의 실 끝이 고양이 발에 감겨 있었다 한다. 편집국은 이 제보들을 모아 연재를 마치며, 고양이를 보시거든 멸치 한 줌을 내주시라 당부한다.',
  p:[['rick','비 오는 길목. 인력거 손님 자리에 먼저 탄 손님.'],['dadeum','똑딱똑딱 다듬이 장단. 꼬리가 박자를 맞춘다.'],['muk','「메밀묵 사려」 소리가 멀어질 때까지 눈을 맞고 섰다.'],['kite','정월 보름. 끊어진 연실 끝에 누가 매달렸나.']]}
];
var NUM=['一','二','三','四'];
var P={};(window.SIMMYO_DATA&&SIMMYO_DATA.P||[]).forEach(function(p){P[p.id]=p});
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(i){return document.getElementById(i)}
var qs=new URLSearchParams(location.search),ep=Math.max(0,Math.min(EP.length-1,(+qs.get('ep')||1)-1)),flat=[];
EP.forEach(function(e,ei){e.p.forEach(function(q,pi){flat.push({ep:ei,pi:pi,id:q[0],nar:q[1]})})});
$('eps').innerHTML=EP.map(function(e,i){return '<button data-i="'+i+'">'+e.no+' · '+e.when+'</button>'}).join('');
function art(id){var a=window.SIDE_ART&&SIDE_ART[id];return a?'../../'+a.src:''}
function render(){var e=EP[ep];$('epno').textContent=e.no;$('epwhen').textContent=e.when;
  [].forEach.call($('eps').children,function(b,i){b.setAttribute('aria-current',i===ep)});
  $('col').innerHTML='<div class="k">連載漫畵 「심묘」 '+e.no+'</div><h2>'+esc(e.title)+'</h2><p>'+esc(e.lead)+'</p><p>'+esc(e.body)+'</p>'+
    '<div class="who"><b>이번 회 나온 곳</b> · '+e.p.map(function(q){return esc((P[q[0]]||{}).name||q[0])}).join(' · ')+'</div>'+
    '<div class="ad"><div class="h">尋 猫 · 고양이를 찾습니다</div><div class="s">눈이 꿀빛이고 표정이 없음 · 불러도 오지 않음<br>현상금 멸치 한 줌 · 경성야록 편집국</div></div>';
  $('strip').innerHTML='<div class="head"><b>심묘 '+e.no+'</b><span>네 칸 · '+e.when+'</span></div>'+e.p.map(function(q,i){var p=P[q[0]]||{};var say=(p.say||[''])[0];
    return '<figure class="pn" tabindex="0" data-i="'+(ep*4+i)+'"><img src="'+art(q[0])+'" alt="'+esc((window.SIDE_ART[q[0]]||{}).alt||p.name)+'" loading="lazy"><span class="no">'+NUM[i]+'</span><span class="nar">'+esc(q[1])+'</span>'+(say?'<span class="bal">'+esc(say)+'</span>':'')+'</figure>'}).join('')+
    '<div class="cont"><span>'+(ep<EP.length-1?'다음 회에 계속':'끝')+'</span></div>';
  [].forEach.call(document.querySelectorAll('.pn'),function(el){el.onclick=function(){show(+el.dataset.i)};el.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();show(+el.dataset.i)}}});
  try{history.replaceState(null,'','?ep='+(ep+1))}catch(e){}}
[].forEach.call($('eps').children,function(b){b.onclick=function(){ep=+b.dataset.i;render();window.snd&&snd('paper');scrollTo({top:0,behavior:'smooth'})}});
var big=$('big'),cur=0;
function show(i){cur=(i+flat.length)%flat.length;var f=flat[cur],p=P[f.id]||{};big.querySelector('img').src=art(f.id);big.querySelector('img').alt=(window.SIDE_ART[f.id]||{}).alt||'';big.querySelector('b').textContent=EP[f.ep].no+' '+NUM[f.pi]+' · '+(p.name||'');big.querySelector('q').textContent=(p.say||[''])[0];big.classList.add('on');window.snd&&snd('paper')}
big.querySelector('.x').onclick=function(){big.classList.remove('on')};big.onclick=function(e){if(e.target===big)big.classList.remove('on')};
big.querySelector('.pv').onclick=function(){show(cur-1)};big.querySelector('.nx').onclick=function(){show(cur+1)};
big.querySelector('.shr').onclick=function(){var f=flat[cur],p=P[f.id]||{};SimmyoShare.open({src:art(f.id),title:p.name,caption:(p.say||[''])[0]})};
big.querySelector('.go').onclick=function(){var r=this.getBoundingClientRect();hopTo('../side/index.html?s='+flat[cur].id+'&from=album',r.left+r.width/2,r.top+r.height/2)};
addEventListener('keydown',function(e){if(!big.classList.contains('on'))return;if(e.key==='Escape')big.classList.remove('on');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
var at=qs.get('at');var back='../road/index.html'+(at?'?at='+at:'');$('backl').href=back;
$('go').onclick=function(){var r=this.getBoundingClientRect();hopTo(back,r.left+r.width/2,r.top+r.height/2)};
render();
})();
</script></body></html>
